[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Аппаратная память и макс. скорость SPI Flash ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio          ; Переходим с DIO на QIO (в 2 раза больше линий передачи)
board_build.f_flash = 80000000L       ; Раскручиваем частоту SPI Flash с дефолтных 40MHz до максимальных 80MHz!
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv


monitor_filters = esp32_exception_decoder
monitor_speed = 115200

build_flags = 
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0